          key_b64="${SIGNING_BUNDLE#*          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          find app/src/main/res -type f -name '*.dw-original' -print -delete
          chmod +x gradlew
          ./gradlew :app:assembleModernDebug --stacktrace --no-daemon --max-workers=2



      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dragonwilds-Mobile-APK-UNTESTED
          path: GameNative/app/build/outputs/apk/modern/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
\\n'}"
          printf '%s' "$key_b64" | tr -d '\\r\\n' | base64 --decode > GameNative/dragonwilds-signing.p12
          printf '%s' "$password" > GameNative/.dragonwilds-signing-password
          chmod 600 GameNative/dragonwilds-signing.p12 GameNative/.dragonwilds-signing-password
          keytool -list -storetype PKCS12 -keystore GameNative/dragonwilds-signing.p12 -storepass "$password" -alias dragonwilds-mobile >/dev/null

      - name: Build ARM64 Android APK
        working-directory: GameNative
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          find app/src/main/res -type f -name '*.dw-original' -print -delete
          chmod +x gradlew
          ./gradlew :app:assembleModernDebug --stacktrace --no-daemon --max-workers=2



      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dragonwilds-Mobile-APK-UNTESTED
          path: GameNative/app/build/outputs/apk/modern/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
