
name: Dragonwilds Mobile APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout build kit
        uses: actions/checkout@v4

      - name: Validate build kit
        run: |
          test -f apply_fork.py
          test -f DragonwildsBootstrap.kt
          if [ -d tests ]; then
            python3 -m unittest discover -s tests -v
          fi

      - name: Download GameNative source
        run: |
          git clone --depth 1 https://github.com/utkarshdalal/GameNative.git GameNative
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android dependencies
        run: |
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.3.13750724' 'platform-tools'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify source compatibility
        run: python3 apply_fork.py GameNative --dry-run

      - name: Apply Dragonwilds modifications
        run: python3 apply_fork.py GameNative
           
      - name: Restore existing permanent APK signing key
        env:
          SIGNING_BUNDLE: ${{ secrets.DRAGONWILDS_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          if [[ -z "${SIGNING_BUNDLE:-}" || "$SIGNING_BUNDLE" != *:* ]]; then
            echo "::error::Missing DRAGONWILDS_SIGNING_BUNDLE; refusing an update-incompatible APK."
            exit 1
          fi
          password="${SIGNING_BUNDLE%%:*}"
          key_b64="${SIGNING_BUNDLE#*:}"
          printf '%s' "$key_b64" | tr -d '\r\n' | base64 --decode > GameNative/dragonwilds-signing.p12
          printf '%s' "$password" > GameNative/.dragonwilds-signing-password
          chmod 600 GameNative/dragonwilds-signing.p12 GameNative/.dragonwilds-signing-password
          keytool -list -storetype PKCS12 -keystore GameNative/dragonwilds-signing.p12 -storepass "$password" -alias dragonwilds-mobile > /dev/null

      - name: Build ARM64 Android APK
        working-directory: GameNative
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          find app/src/main/res -type f -name '*.dw-original' -print -delete
          chmod +x gradlew
          export DRAGONWILDS_SIGNING_PASSWORD="$(cat .dragonwilds-signing-password)"
          ./gradlew :app:assembleModernDebug --stacktrace --no-daemon --max-workers=2



      - name: Verify permanent APK signer
        working-directory: GameNative
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/modern/debug -name '*.apk' -type f)
          test "${#apks[@]}" -eq 1
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "${apks[0]}" | grep -q 'Signer #1 certificate DN: CN=Dragonwilds Mobile'
          rm -f dragonwilds-signing.p12 .dragonwilds-signing-password

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dragonwilds-Mobile-STABLE-SIGNED-APK-UNTESTED
          path: GameNative/app/build/outputs/apk/modern/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
