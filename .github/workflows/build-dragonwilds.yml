
name: Dragonwilds Mobile APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout build kit
        uses: actions/checkout@v4

      - name: Validate build kit
        run: |
          test -f apply_fork.py
          test -f DragonwildsBootstrap.kt
          test -f DragonwildsHome.kt
          test -f DragonwildsImport.kt
          python3 -m py_compile apply_fork.py
          if [ -d tests ]; then
            python3 -m unittest discover -s tests -v
          fi

      - name: Download GameNative source
        run: |
          git clone --depth 1 https://github.com/utkarshdalal/GameNative.git GameNative
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android dependencies
        run: |
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.3.13750724' 'platform-tools'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify source compatibility
        run: python3 apply_fork.py GameNative --dry-run

      - name: Apply Dragonwilds modifications
        run: python3 apply_fork.py GameNative
           
      # An Android update must be signed by exactly the same private key
      # as the installed APK. GitHub-hosted runners generate a NEW random debug
      # key each job unless this key is restored from a repository secret.
      # Never fall back to ephemeral signing and publish a non-upgradable APK.
      - name: Restore persistent Android signing key
        env:
          DRAGONWILDS_DEBUG_KEYSTORE_B64: ${{ secrets.DRAGONWILDS_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DRAGONWILDS_DEBUG_KEYSTORE_B64" ]; then
            echo "::error::Missing DRAGONWILDS_DEBUG_KEYSTORE_B64 repository secret. Refusing to create a non-upgradable test APK."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          chmod 700 "$HOME/.android"
          printf '%s' "$DRAGONWILDS_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          echo "Persistent Android signing key validated"

      - name: Build ARM64 Android APK
        working-directory: GameNative
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          find app/src/main/res -type f -name '*.dw-original' -print -delete
          chmod +x gradlew
          ./gradlew :app:assembleModernDebug --stacktrace --no-daemon --max-workers=2



      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dragonwilds-Mobile-APK-UNTESTED
          path: GameNative/app/build/outputs/apk/modern/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
